name: CI

# Gate every change into main: lint, formatting and types must pass AND no new
# Pixel token/component violations may be introduced. Make this a required
# status check in the branch-protection settings so a red run blocks the merge.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  gate:
    name: Lint + Types + Pixel Police
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for the diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        # postinstall runs `nuxt prepare`, which generates .nuxt/ — needed for
        # eslint's type-aware Nuxt config to resolve auto-imports.
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        # Catches what eslint cannot: none of the sixteen errors this repo
        # started from were lint errors. `pnpm install` above already ran
        # `nuxt prepare`, so the generated types this needs are in place.
        #
        # `vue-tsc` is a direct devDependency for this step's sake. Without it
        # `nuxt typecheck` npx-fetches one into an isolated tree that ignores
        # this project's `typescript` pin, and resolved TypeScript 7 on the
        # runner — which dropped the `./lib/tsc` subpath export that vue-tsc
        # requires, so the step died with ERR_PACKAGE_PATH_NOT_EXPORTED before
        # checking a single file. It passed locally only because the local npx
        # cache happened to hold TypeScript 6.
        run: pnpm typecheck

      - name: Pixel Police — token/component check on changed .vue
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
          fi
          bash scripts/pixel-police.sh "$BASE"
